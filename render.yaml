# =====================================================================
# Render.com Infrastructure Blueprint (render.yaml)
# Flood Risk Prediction & Relief Camp Locator (PostgreSQL + Docker Web Service)
# =====================================================================

services:
  - type: web
    name: flood-relief-dss
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: flood-relief-postgres
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: tls
      - key: SMTP_FROM
        value: alerts@floodrelief.gov.in

databases:
  - name: flood-relief-postgres
    databaseName: flood_relief_db
    user: postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"
